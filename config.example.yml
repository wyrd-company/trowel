# nats-relay example configuration.
# ${NAME} references are replaced from the environment at load time.
# Every *_file field reads a mounted secret instead of an inline value.

server:
  listen: ":8080"
  read_header_timeout: 10s

nats:
  url: ${NATS_URL}
  name: nats-relay
  # creds_file: /run/secrets/nats.creds

# HTTP -> NATS. Each webhook is served at its path and publishes to JetStream.
# A stream must already cover every subject the template can expand to.
webhooks:
  - path: /hooks/github
    # {headers.Name} and {payload.a.b[0]} expand from the (transformed) message.
    # Values are sanitised: '.', '*', '>' and whitespace become '_'.
    subject: github.{headers.X-GitHub-Event}
    # Requests larger than this get 413.
    max_body_bytes: 10485760
    # Sets Nats-Msg-Id so JetStream de-duplicates redeliveries.
    message_id_header: X-GitHub-Delivery
    verify:
      hmac:
        algorithm: sha256
        header: X-Hub-Signature-256
        prefix: "sha256="
        encoding: hex
        secret: ${GITHUB_WEBHOOK_SECRET}
        # secret_file: /run/secrets/github-webhook
    # Optional JSONata. Input is {"headers": {...}, "payload": <json>, "subject": ""}.
    # Header names with '-' need backticks: headers.`X-GitHub-Event`
    transform:
      # headers: '{"X-GitHub-Event": headers.`X-GitHub-Event`, "X-Repo": payload.repository.full_name}'
      # payload: '{"repo": payload.repository.full_name, "ref": payload.ref, "sender": payload.sender.login}'

# NATS -> HTTP or command. One durable consumer per destination, named
# relay-<name>-<destination>, so each destination retries independently.
subjects:
  - name: github-push
    # stream: EVENTS            # optional; resolved from the subject when omitted
    subject: github.push
    transform:
      # payload: '{"repo": payload.repository.full_name, "after": payload.after}'
    consumer:
      deliver_policy: new       # all | new | last
      ack_wait: 30s
      max_deliver: 5            # -1 for unlimited (then no DLQ)
      backoff: [1s, 5s, 30s, 2m]   # fewer entries than max_deliver
      max_ack_pending: 64
      # After max_deliver failures the message is published here with
      # Relay-* headers describing the failure, then terminated.
      dlq_subject: dlq.github-push
    destinations:
      - name: deploy-api
        http:
          url: https://deploy.example.invalid/hooks/push
          method: POST
          timeout: 30s
          headers:
            Content-Type: application/json
          sign:
            hmac:
              algorithm: sha256
              header: X-Signature-256
              prefix: "sha256="
              secret: ${DEPLOY_HMAC_SECRET}
              # secret_file: /run/secrets/deploy-hmac
            # ed25519:
            #   signature_header: X-Signature-Ed25519
            #   timestamp_header: X-Signature-Timestamp
            #   encoding: hex
            #   private_key_file: /run/secrets/deploy-ed25519   # 32-byte seed, hex or base64
            # static:
            #   header: X-Api-Key
            #   secret_file: /run/secrets/deploy-key
      - name: local-script
        command:
          # Payload on stdin. Headers as <env_prefix>NAME env vars, subject as RELAY_SUBJECT.
          # This demo echoes the subject and payload; stdout is logged by the relay.
          argv: ["sh", "-c", "echo \"$RELAY_SUBJECT $RELAY_HEADER_X_GITHUB_DELIVERY: $(cat)\""]
          # dir: /work
          env:
            DEPLOY_ENV: staging
          env_prefix: RELAY_HEADER_
          timeout: 60s

# Inbound verification alternatives (exactly one per webhook):
#
#   verify:
#     ed25519:
#       signature_header: X-Signature-Ed25519
#       timestamp_header: X-Signature-Timestamp   # unix seconds; signed content is "<ts>.<body>"
#       encoding: hex
#       tolerance: 5m
#       public_key: ${SENDER_PUBLIC_KEY}          # 32 bytes, hex or base64
#
