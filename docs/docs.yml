name: trowel
tagline: Relay webhooks into NATS JetStream, and JetStream messages back out.
blurb: >-
  A small Go service that verifies and transforms incoming webhooks, publishes
  them to JetStream with an acknowledgement, and delivers JetStream messages to
  HTTP endpoints or commands with retries, signing, and dead-lettering. Secrets
  can come from OpenBao or Vault over https or a unix socket.
category: Agent Infrastructure
language: Go
status: preview
repo: https://github.com/wyrd-company/trowel
order: 8
install:
  - label: APT
    command: sudo apt install trowel
  - label: RPM
    command: sudo dnf install trowel
  - label: AUR
    command: paru -S trowel-bin
  - label: Docker
    command: docker pull ghcr.io/wyrd-company/trowel:latest
assets:
  - assets/demo.gif
