version: "3"

vars:
  VERSION: '{{.VERSION | default "dev"}}'
  IMAGE: ghcr.io/wyrd-company/trowel
  LDFLAGS: -s -w -X github.com/wyrd-company/trowel/internal/app.Version={{.VERSION}}
  GORELEASER: go run github.com/goreleaser/goreleaser/v2@v2.17.0
  ACTIONLINT: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  FEATURE_BASE_IMAGE: ghcr.io/wyrd-company/devcontainers/base:noble

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  format:
    desc: Format Go sources
    cmds:
      - gofmt -w .

  format:check:
    desc: Fail when Go sources are not formatted
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Vet and check formatting
    deps: [ vet, format:check ]

  test:
    desc: Run all tests (OpenBao tests skip without bao)
    cmds:
      - go test ./...

  test:ci:
    desc: Run uncached tests and fail if the OpenBao tests were skipped
    cmds:
      - bash scripts/test-ci.sh

  build:
    desc: Build the binary into bin/
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags="{{.LDFLAGS}}" -o bin/trowel ./cmd/trowel

  validate:
    desc: Validate a config file (CONFIG=path)
    vars:
      CONFIG: '{{.CONFIG | default "config.example.yml"}}'
    cmds:
      - go run ./cmd/trowel -config {{.CONFIG}} -validate

  scripts:check:
    desc: Check release automation scripts
    cmds:
      - bash -n scripts/*.sh packaging/*.sh features/src/trowel/install.sh features/test/trowel/*.sh
      - python3 -m py_compile scripts/*.py

  workflows:check:
    desc: Validate GitHub Actions workflows
    cmds:
      - '{{.ACTIONLINT}}'

  intentional:check:
    desc: Validate intentional config and pending intents
    cmds:
      # The first release tag is the baseline. Until it exists, check reports
      # a missing baseline, so status validates the config and intents instead.
      - |
        if [ -n "$(git tag --list '[0-9]*.[0-9]*.[0-9]*')" ]; then
          intentional check
        else
          intentional status
        fi

  check:
    desc: Run all repository checks
    deps:
      - vet
      - format:check
      - build
      - release:check
      - scripts:check
      - workflows:check
      - intentional:check
      - task: '{{default "test" .TEST_TASK}}'

  ci:
    desc: Run all checks and require the OpenBao tests to execute
    cmds:
      - task: check
        vars:
          TEST_TASK: test:ci

  release:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - '{{.GORELEASER}} check .goreleaser.yaml'

  release:snapshot:
    desc: Build local release artifacts into dist/ without publishing
    cmds:
      - RELEASE_VERSION="${RELEASE_VERSION:-0.0.0}" {{.GORELEASER}} release --snapshot --clean

  release:compatibility:
    desc: Build packages and prove the pinned repo.wyrd.foo publisher contract
    requires:
      vars:
        - PUBLISHER_ROOT
        - PUBLISHER_COMMIT
        - RELEASE_VERSION
        - RELEASE_COMMIT
    deps:
      - vet
      - format:check
      - release:check
      - scripts:check
      - test
    cmds:
      - RELEASE_VERSION="{{.RELEASE_VERSION}}" {{.GORELEASER}} release --snapshot --clean
      - >-
        scripts/create-release-manifest.py
        --artifacts-dir dist
        --version "{{.RELEASE_VERSION}}"
        --commit "{{.RELEASE_COMMIT}}"
        --output dist/release-manifest.json
      - >-
        scripts/validate-publisher-contract.sh
        "{{.PUBLISHER_ROOT}}"
        "{{.PUBLISHER_COMMIT}}"
        dist/release-manifest.json
        dist
        dist/publisher-contract

  feature:binary:
    desc: Build a linux/amd64 binary the devcontainer Feature tests install
    cmds:
      - >-
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64
        go build -trimpath -ldflags="{{.LDFLAGS}}"
        -o features/src/trowel/ci-binary/trowel ./cmd/trowel

  feature:test:
    desc: Run the devcontainer Feature tests (needs Docker and the devcontainer CLI)
    deps: [ feature:binary ]
    cmds:
      - >-
        devcontainer features test --project-folder features
        --features trowel --skip-scenarios --skip-duplicated
        --base-image {{.FEATURE_BASE_IMAGE}}
      - >-
        devcontainer features test --project-folder features
        --features trowel --skip-autogenerated --skip-duplicated

  feature:runtime:
    desc: Run the Feature under s6-overlay against a NATS server (needs Docker)
    deps: [ feature:binary ]
    cmds:
      - BASE_IMAGE={{.FEATURE_BASE_IMAGE}} features/test/trowel/runtime.sh

  demo:
    desc: Record docs/user/assets/demo.gif with vhs (needs Docker)
    cmds:
      - docs/demo/record.sh

  docker:build:
    desc: Build the container image
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} -t {{.IMAGE}}:{{.VERSION}} .

  up:
    desc: Start NATS and the relay with docker compose
    cmds:
      - docker compose up --build

  down:
    desc: Stop docker compose services
    cmds:
      - docker compose down
