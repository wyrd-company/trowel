name: Publish docs

# Runs after each successful Release. A release created with GITHUB_TOKEN
# cannot trigger a release event, so this follows the workflow run instead.
# Dispatch it by hand to republish the docs of an existing release.
on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Bare stable SemVer release whose docs must publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Validate documentation release tag
        shell: bash
        env:
          DOCS_TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$DOCS_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          then
          echo "Documentation release tags must be bare stable SemVer values." >&2
          exit 1
          fi

      - name: Check out released documentation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.tag }}

      - name: Publish released documentation
        uses: wyrd-company/wyrd.foo/.github/actions/publish-docs@fdb54b12e88eaf51a2b22714db63c80aba2ed88a # v1
        with:
          app-id: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY }}
