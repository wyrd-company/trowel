name: Publish to wyrd.foo

# Publishes docs/user and the release data to wyrd.foo after each successful
# Release (the code unit, trowel), when a docs unit tag (trowel-docs@{version})
# is pushed, and on a manual run. A plain push to main does not publish. The
# code unit follows the Release workflow instead of the tag push on its own:
# wyrd.foo reads the GitHub Release of the tag, and a release created with
# GITHUB_TOKEN cannot trigger a release event.
on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  push:
    tags:
      - "trowel-docs@*"
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish
        required: true
      feature:
        description: Feature a product on the front page
        type: boolean
        default: false
      feature-product:
        description: The product key to feature; empty when the repo has one product
        default: ""
      feature-days:
        description: How long the feature lasts, in days
        default: "14"
      feature-reason:
        description: For example "New MCP server"; default "New release"
        default: ""

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    uses: wyrd-company/wyrd.foo/.github/workflows/publish-docs.yml@v2
    with:
      ref: ${{ inputs.ref || github.event.workflow_run.head_branch || github.ref_name }}
      feature: ${{ inputs.feature || false }}
      feature-product: ${{ inputs.feature-product || '' }}
      feature-days: ${{ inputs.feature-days || '14' }}
      feature-reason: ${{ inputs.feature-reason || '' }}
    secrets: inherit
