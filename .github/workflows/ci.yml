name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    env:
      OPENBAO_VERSION: 2.7.1
    steps:
      - name: Check out source with release tags
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install repository check tools
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          npm install --global @wyrd-company/intentional@0.1.6

      - name: Install OpenBao
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/openbao"
          mkdir -p "$directory"
          cd "$directory"
          archive="openbao_${OPENBAO_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/openbao/openbao/releases/download/v${OPENBAO_VERSION}"
          curl --fail --location --output "$archive" "$base/$archive"
          curl --fail --location --output checksums.txt "$base/checksums.txt"
          grep "  $archive\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" bao
          "$directory/bao" version
          echo "TROWEL_BAO=$directory/bao" >> "$GITHUB_ENV"

      - name: Validate repository
        run: task ci

  feature:
    name: Devcontainer Feature
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install test tools
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          npm install --global @devcontainers/cli@0.89.0

      - name: Test the Feature
        run: task feature:test

      - name: Test the Feature under s6-overlay
        run: task feature:runtime
